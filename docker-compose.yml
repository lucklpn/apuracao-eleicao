services:
  apuracao-votos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apuracao-tse
    restart: unless-stopped
    ports:
      # Alterado para 8085 para evitar conflito com portas já em uso na VPS
      - "127.0.0.1:8085:80"
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
