<VirtualHost *:80>
    ServerName apuracao.hexadm.com.br
    ServerAdmin webmaster@hexadm.com.br

    # Configuração de Proxy Reverso para o Container Docker
    ProxyPreserveHost On
    ProxyRequests Off

    <Proxy *>
        Require all granted
    </Proxy>

    # Encaminha todo o tráfego para a porta exposta pelo Docker (8080)
    ProxyPass / http://127.0.0.1:8080/ retry=0 timeout=60
    ProxyPassReverse / http://127.0.0.1:8080/

    # Suporte a WebSocket caso necessário
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)           ws://127.0.0.1:8080/$1 [P,L]

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/apuracao_hexadm_error.log
    CustomLog ${APACHE_LOG_DIR}/apuracao_hexadm_access.log combined
</VirtualHost>
